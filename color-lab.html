<script>
  // OFFICIAL PANTONE SPOT COLOR DATABASE WITH MULTI-INK RECIPES (3 TO 5 INKS)
  const masterDatabase = {
    // 3 Ink Recipe
    "185": { 
      num: "Pantone 185 C", 
      hex: "#E4002B", 
      recipe: [["Pantone Warm Red", "75.0%"], ["Pantone Rubine Red", "21.9%"], ["Pantone Black", "3.1%"]] 
    },
    // 4 Ink Recipe
    "1655": { 
      num: "Pantone 1655 C", 
      hex: "#FF5800", 
      recipe: [["Pantone Yellow 012", "50.0%"], ["Pantone Warm Red", "43.8%"], ["Pantone Black", "3.1%"], ["Pantone Transparent White", "3.1%"]] 
    },
    // 3 Ink Recipe
    "293": { 
      num: "Pantone 293 C", 
      hex: "#003DA5", 
      recipe: [["Pantone Reflex Blue", "87.5%"], ["Pantone Process Blue", "9.4%"], ["Pantone Black", "3.1%"]] 
    },
    // 4 Ink Recipe
    "485": { 
      num: "Pantone 485 C", 
      hex: "#DA291C", 
      recipe: [["Pantone Yellow", "46.9%"], ["Pantone Warm Red", "46.9%"], ["Pantone Black", "3.1%"], ["Pantone Transparent White", "3.1%"]] 
    },
    // 5 Ink Recipe Example
    "7771": { 
      num: "Pantone 7771 C", 
      hex: "#423D33", 
      recipe: [["Pantone Black", "58.0%"], ["Pantone Yellow", "22.0%"], ["Pantone Warm Red", "12.0%"], ["Pantone Green", "5.0%"], ["Pantone Transparent White", "3.0%"]] 
    },
    // 4 Ink Recipe
    "2023": { 
      num: "Pantone 2023 C", 
      hex: "#FF8B53", 
      recipe: [["Pantone Orange 021", "12.5%"], ["Pantone Yellow", "12.5%"], ["Pantone Black", "1.0%"], ["Pantone Transparent White", "74.0%"]] 
    },
    // 3 Ink Recipe
    "151": { 
      num: "Pantone 151 C", 
      hex: "#FF8200", 
      recipe: [["Pantone Orange 021", "48.5%"], ["Pantone Yellow", "48.5%"], ["Pantone Black", "3.0%"]] 
    },
    // 4 Ink Recipe
    "300": { 
      num: "Pantone 300 C", 
      hex: "#005BBB", 
      recipe: [["Pantone Process Blue", "85.0%"], ["Pantone Reflex Blue", "10.0%"], ["Pantone Black", "2.5%"], ["Pantone Transparent White", "2.5%"]] 
    }
  };

  function renderGrid(list) {
    const grid = document.getElementById('pantoneGrid');
    grid.innerHTML = '';
    if (!list || list.length === 0) {
      grid.innerHTML = '<div style="color: #94a3b8; grid-column: 1/-1; text-align: center; padding: 20px;">⚠️ यह पैनटोन नंबर डाटाबेस में उपलब्ध नहीं है। कृपया 1655, 185, 293, 485, 7771, 2023 ट्राई करें।</div>';
      return;
    }
    list.forEach(item => {
      const card = document.createElement('div');
      card.className = 'p-card';
      let rHTML = '';
      item.recipe.forEach(r => {
        rHTML += `<li><span>${r[0]}</span><b style="color:#00f2fe;">${r[1]}</b></li>`;
      });
      card.innerHTML = `
        <div class="p-swatch" style="background-color: ${item.hex}; height: 90px;">
          <span style="background:rgba(0,0,0,0.85); color:#fff; padding:3px 8px; border-radius:4px; font-size:11px;">HEX: ${item.hex}</span>
        </div>
        <div class="p-info">
          <div class="p-title" style="margin-bottom:8px;">${item.num}</div>
          <div style="font-size:11px; color:#94a3b8; margin-bottom:4px;">Ink Recipe (Mixing Ratio):</div>
          <ul class="recipe-list">${rHTML}</ul>
        </div>`;
      grid.appendChild(card);
    });
  }

  function searchPantone() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    if (!q) {
      renderGrid(["1655", "185", "293", "485", "7771", "2023"].map(n => masterDatabase[n]));
      return;
    }
    const cleanNum = q.replace('pantone', '').replace('c', '').trim();
    const res = masterDatabase[cleanNum];
    renderGrid(res ? [res] : []);
  }

  searchPantone();
</script>
